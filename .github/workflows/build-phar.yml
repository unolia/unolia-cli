name: Build PHAR
on:
  release:
    types: [ created ]

permissions: {}

env:
  BOX_VERSION: "4.7.0"
  BOX_SHA256: "3d390eeaec33288098fe83f8a54c60cc575cb6be295f38ff4482b4b4f26f8d52"

jobs:
  build-phar:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.3"
          tools: composer:v2
          ini-values: phar.readonly=0

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Composer install
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      # Box is downloaded from its release rather than required, so it never touches composer.lock.
      - name: Install Box
        run: |
          curl -sSL -o box.phar "https://github.com/box-project/box/releases/download/${BOX_VERSION}/box.phar"
          echo "${BOX_SHA256}  box.phar" | sha256sum --check --status
          chmod +x box.phar

      - name: Generate PHAR file
        run: ./box.phar compile --no-interaction

      - name: Smoke test the PHAR
        run: |
          php build/unolia.phar --version | grep -F "${GITHUB_REF_NAME#v}"
          php build/unolia.phar domain --help

      # `unolia upgrade` refuses a phar whose hash does not match this file.
      - name: Write the checksum
        run: |
          cd build
          sha256sum unolia.phar > unolia.phar.sha256
          cat unolia.phar.sha256

      - name: Upload phar to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2.4.1
        with:
          files: |
            build/unolia.phar
            build/unolia.phar.sha256
